<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golf Courses Map</title>

        <link rel="apple-touch-icon" href="apple-touch-icon.png">
        <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Golf Mapy">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-dark: #0f1117;
            --bg-darker: #010409;
            --bg-card: #161b22;
            --bg-input: #0d1117;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --text-muted: #6e7681;
            --border: #30363d;
            --accent: #58a6ff;
            --accent-hover: #79c0ff;
            --success: #3fb950;
            --danger: #f85149;
            --warning: #d29922;
        }
        
        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
        }
        
        #map {
            height: 100%;
            width: 100%;
            background: var(--bg-darker);
        }
        
        /* Dark Leaflet theme */
        .leaflet-tile {
            filter: brightness(0.8) contrast(1.1);
        }
        
        /* Top Left Panel */
        .sidebar {
            position: absolute;
            top: 16px;
            left: 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            z-index: 1000;
            max-width: 360px;
            overflow: hidden;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        
        .sidebar.visible {
            opacity: 1;
            pointer-events: auto;
        }
        
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .sidebar-header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 2px;
        }
        
        .sidebar-header p {
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .sidebar-content {
            padding: 20px;
        }
        
        .search-wrapper {
            margin-bottom: 20px;
            position: relative;
        }
        
        .search-input {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 13px;
            transition: all 0.2s ease;
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.1);
            background: var(--bg-card);
        }
        
        .search-input::placeholder {
            color: var(--text-muted);
        }
        
        /* Filter Section */
        .filter-section {
            margin-bottom: 24px;
        }
        
        .filter-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            display: block;
            margin-bottom: 8px;
        }
        
        .filter-tabs {
            display: flex;
            gap: 6px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }
        
        .filter-tab {
            padding: 6px 12px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
            margin-bottom: -9px;
        }
        
        .filter-tab:hover {
            color: var(--accent);
        }
        
        .filter-tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .stat-box {
            background: var(--bg-input);
            padding: 12px;
            border-radius: 4px;
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }
        
        .stat-box:hover {
            border-color: var(--accent);
            background: rgba(88, 166, 255, 0.05);
        }
        
        .stat-label {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 4px;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }
        
        .stat-percent {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        
        .stat-box.success {
            border-color: rgba(63, 185, 80, 0.3);
            background: rgba(63, 185, 80, 0.05);
        }
        
        .stat-box.success .stat-value {
            color: var(--success);
        }
        
        .stat-box.danger {
            border-color: rgba(248, 81, 73, 0.3);
            background: rgba(248, 81, 73, 0.05);
        }
        
        .stat-box.danger .stat-value {
            color: var(--danger);
        }
        
        /* Bottom Info Panel */
        .info-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.4);
            z-index: 500;
            max-height: 50vh;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(8px);
        }
        
        .info-panel.active {
            transform: translateY(0);
        }
        
        .info-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }
        
        .info-title {
            flex: 1;
        }
        
        .info-title h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }
        
        .info-title p {
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease;
            flex-shrink: 0;
        }
        
        .close-btn:hover {
            color: var(--accent);
        }
        
        .info-content {
            padding: 20px;
        }
        
        .info-row {
            margin-bottom: 12px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .info-label {
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .info-value {
            color: var(--text-primary);
            text-align: right;
        }
        
        .info-row a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.2s ease;
        }
        
        .info-row a:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }
        
        .info-divider {
            height: 1px;
            background: var(--border);
            margin: 16px 0;
        }
        
        .action-group {
            display: flex;
            gap: 8px;
        }
        
        .btn {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid var(--border);
            background: var(--bg-input);
            color: var(--text-primary);
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            text-align: center;
        }
        
        .btn:hover {
            border-color: var(--accent);
            background: rgba(88, 166, 255, 0.05);
            color: var(--accent);
        }
        
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
        }
        
        .checkbox-row input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--accent);
        }
        
        .checkbox-row label {
            font-size: 13px;
            color: var(--text-primary);
            cursor: pointer;
            flex: 1;
        }
        
        /* Rating Slider */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: var(--border);
            outline: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            border: 2px solid var(--bg-card);
            box-shadow: 0 2px 4px rgba(88, 166, 255, 0.3);
            transition: all 0.2s ease;
        }
        
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 8px rgba(88, 166, 255, 0.5);
        }
        
        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            border: 2px solid var(--bg-card);
            box-shadow: 0 2px 4px rgba(88, 166, 255, 0.3);
            transition: all 0.2s ease;
        }
        
        input[type="range"]::-moz-range-thumb:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 8px rgba(88, 166, 255, 0.5);
        }
        
        /* Legend */
        .legend {
            position: absolute;
            bottom: 16px;
            right: 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            z-index: 1000;
            font-size: 12px;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }
        
        .legend-item:last-child {
            margin-bottom: 0;
        }
        
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1.5px solid #333;
            flex-shrink: 0;
        }
        
        .legend-dot.played {
            background: var(--success);
            border-color: rgba(63, 185, 80, 0.6);
        }
        
        .legend-dot.unplayed {
            background: var(--danger);
            border-color: rgba(248, 81, 73, 0.6);
        }
        
        /* Scrollbar styling */
        .info-panel::-webkit-scrollbar {
            width: 6px;
        }
        
        .info-panel::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .info-panel::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        
        .info-panel::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }
        
        /* Responsive */
        @media (max-width: 640px) {
            .sidebar {
                max-width: calc(100% - 32px);
            }
            
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            
            .info-panel {
                max-height: 60vh;
            }
            
            .filter-tabs {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <!-- Left Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h1>Golf Courses</h1>
            <p>Czech Republic</p>
        </div>
        <div class="sidebar-content">
            <!-- Search -->
            <div class="search-wrapper">
                <input 
                    type="text" 
                    class="search-input" 
                    id="searchInput" 
                    placeholder="Search courses..."
                >
            </div>
            
            <!-- Filter -->
            <div class="filter-section">
                <label class="filter-label">Filter</label>
                <div class="filter-tabs">
                    <button class="filter-tab active" data-filter="all">All</button>
                    <button class="filter-tab" data-filter="played">Played</button>
                    <button class="filter-tab" data-filter="unplayed">Unplayed</button>
                </div>
            </div>
            
            <!-- Stats -->
            <div class="filter-section">
                <label class="filter-label">Statistics</label>
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-label">Total</div>
                        <div class="stat-value" id="totalCourses">0</div>
                    </div>
                    <div class="stat-box success">
                        <div class="stat-label">Played</div>
                        <div class="stat-value" id="playedCourses">0</div>
                        <div class="stat-percent" id="playedPercent">0%</div>
                    </div>
                    <div class="stat-box danger">
                        <div class="stat-label">Remaining</div>
                        <div class="stat-value" id="unplayedCourses">0</div>
                        <div class="stat-percent" id="unplayedPercent">0%</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Progress</div>
                        <div class="stat-value" id="playedPercentage">0%</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Legend -->
    <div class="legend">
        <div class="legend-item">
            <div class="legend-dot played"></div>
            <span>Played</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot unplayed"></div>
            <span>Unplayed</span>
        </div>
    </div>
    
    <!-- Bottom Info Panel -->
    <div class="info-panel" id="infoPanel">
        <div class="info-header">
            <div class="info-title">
                <h2 id="courseName">-</h2>
                <p><span id="courseRegion">-</span> • <span id="courseHoles">-</span> holes</p>
            </div>
            <button class="close-btn" onclick="closeInfo()">×</button>
        </div>
        <div class="info-content">
            <div class="info-row">
                <span class="info-label">Rating:</span>
                <span class="info-value" id="courseRating">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Location:</span>
                <span class="info-value" id="courseLocation">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Website:</span>
                <a id="courseWebLink" href="#" target="_blank">Visit</a>
            </div>
            
            <div class="info-divider"></div>
            
            <div class="action-group">
                <button class="btn" onclick="openWeb()" id="courseWebBtn">Open Website</button>
                <button class="btn" onclick="togglePlayed()">Mark Played</button>
            </div>
            
            <div style="margin-top: 12px;">
                <div class="checkbox-row">
                    <input type="checkbox" id="playedCheckbox" onchange="togglePlayed()">
                    <label for="playedCheckbox">Mark as played</label>
                </div>
            </div>
            
            <div class="info-divider"></div>
            
            <div style="margin-top: 12px;">
                <div class="filter-label" style="margin-bottom: 8px;">Rate this course</div>
                <div style="display: flex; align-items: center; gap: 12px;">
                    <input type="range" id="ratingSlider" min="0" max="10" value="0" onchange="updateRating()" style="flex: 1; cursor: pointer;">
                    <span id="ratingValue" style="font-size: 14px; font-weight: 600; color: var(--accent); min-width: 30px; text-align: center;">-</span>
                </div>
            </div>
        </div>
    </div>

l", "holes": 9, "region": "Zlínský", "location": "Z – Velké Karlovice", "lat": 49.376667, "lng": 18.3925, "web": "https://www.valachy.cz/aktuality/golf-beskydy.aspx", "rating": 7}, {"id": 99, "name": "Zlín", "holes": 9, "region": "Zlínský", "location": "Z – Zlín 12 – Kostelec", "lat": 49.255, "lng": 17.6975, "web": "https://www.gclk.cz", "rating": 6}, {"id": 100, "name": "Krásný Dvůr", "holes": 6, "region": "Ústecký", "location": "U – Krásný Dvůr – Brody", "lat": 50.242925, "lng": 13.355242, "web": "https://www.golfkd.cz", "rating": 5}, {"id": 101, "name": "Kšírovka", "holes": 6, "region": "Brno", "location": "B – Brno", "lat": 49.169089, "lng": 16.618706, "web": "https://www.ksirovka.cz", "rating": 5}, {"id": 102, "name": "Úholičky – Snail golf", "holes": 6, "region": "Středočeský", "location": "S – Úholičky", "lat": 50.173411, "lng": 14.339864, "web": "https://www.golfsnail.cz", "rating": 5}, {"id": 103, "name": "Yard Resort – Předboj", "holes": 6, "region": "Středočeský", "location": "S – Předboj", "lat": 50.223333, "lng": 14.475833, "web": "https://www.yardresort.cz", "rating": 6}, {"id": 108, "name": "Město Albrechtice", "holes": 6, "region": "Olomoucký", "location": "M – Město Albrechtice", "lat": 50.164636, "lng": 17.569597, "web": "https://www.gcma.cz", "rating": 5}, {"id": 109, "name": "Příseka, Jihlava", "holes": 3, "region": "Jihlavský", "location": "J – Jihlava", "lat": 49.337778, "lng": 15.653611, "web": "https://www.golf-jihlava.cz", "rating": 4}, {"id": 121, "name": "Třímany", "holes": 18, "region": "Středočeský", "location": "S – Třímany", "lat": 49.94, "lng": 13.6075, "web": "https://example.com", "rating": 7}];

        const playedCourses = new Set();
        const courseRatings = {};
        let currentFilter = 'all';
        let markers = {};
        
        const map = L.map('map').setView([49.8, 15.4], 7);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        function init() {
            const saved = localStorage.getItem('playedCourses');
            if (saved) {
                saved.split(',').forEach(id => playedCourses.add(parseInt(id)));
            }
            
            const savedRatings = localStorage.getItem('courseRatings');
            if (savedRatings) {
                try {
                    const parsed = JSON.parse(savedRatings);
                    Object.assign(courseRatings, parsed);
                } catch (e) {
                    console.error('Error loading ratings:', e);
                }
            }
            
            addMarkers();
            updateStats();
            
            document.getElementById('searchInput').addEventListener('input', filterCourses);
            document.querySelectorAll('.filter-tab').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentFilter = e.target.dataset.filter;
                    updateMarkers();
                });
            });
        }

        function getColor(courseId) {
            const rating = courseRatings[courseId] || 0;
            if (rating === 0) return playedCourses.has(courseId) ? '#3fb950' : '#f85149';
            // 10/10 = tmavě zelená #1a4d2e, 1/10 = světle zelená #b7e4c7
            const t = rating / 10;
            const r = Math.round(183 - t * (183 - 26));
            const g = Math.round(228 - t * (228 - 77));
            const b = Math.round(199 - t * (199 - 46));
            return `rgb(${r},${g},${b})`;
        }

        function addMarkers() {
            golfData.forEach(course => {
                const rating = courseRatings[course.id] || 0;
                const ratingPercent = rating > 0 ? (rating * 10) + '%' : '';
                
                const marker = L.circleMarker([course.lat, course.lng], {
                    radius: 6,
                    color: 'rgba(0, 0, 0, 0.3)',
                    weight: 1.5,
                    fill: true,
                    fillOpacity: 0.9,
                    fillColor: getColor(course.id)
                }).addTo(map);
                
                marker.bindPopup(`<div style="font-size: 12px; color: var(--text-primary);"><strong>${course.name}</strong><br>${course.region}<br>${course.holes} holes${ratingPercent ? '<br>Rating: ' + ratingPercent : ''}</div>`);
                
                marker.on('click', () => showCourseInfo(course));
                markers[course.id] = marker;
            });
        }

        function updateMarkers() {
            golfData.forEach(course => {
                const marker = markers[course.id];
                if (!marker) return;

                let visible = true;
                const fillColor = getColor(course.id);

                if (currentFilter === 'played') visible = playedCourses.has(course.id);
                if (currentFilter === 'unplayed') visible = !playedCourses.has(course.id);

                marker.setStyle({ fillColor });
                marker.setOpacity(visible ? 0.9 : 0.15);
            });
        }

        function showCourseInfo(course) {
            currentCourse = course;
            const isPlayed = playedCourses.has(course.id);
            const rating = courseRatings[course.id] || 0;
            
            document.getElementById('courseName').textContent = course.name;
            document.getElementById('courseHoles').textContent = course.holes;
            document.getElementById('courseRegion').textContent = course.region;
            document.getElementById('courseLocation').textContent = course.location;
            document.getElementById('courseWebLink').textContent = course.web;
            document.getElementById('courseWebLink').href = course.web;
            document.getElementById('courseWebBtn').href = course.web;
            document.getElementById('playedCheckbox').checked = isPlayed;
            document.getElementById('ratingSlider').value = rating;
            
            // Update rating display
            if (rating === 0) {
                document.getElementById('ratingValue').textContent = '-';
            } else {
                document.getElementById('ratingValue').textContent = rating + '/10';
            }
            
            // Show sidebar and info panel
            document.getElementById('sidebar').classList.add('visible');
            document.getElementById('infoPanel').classList.add('active');
        }

        function closeInfo() {
            document.getElementById('infoPanel').classList.remove('active');
            document.getElementById('sidebar').classList.remove('visible');
        }

        function togglePlayed() {
            if (!currentCourse) return;
            
            const isChecked = document.getElementById('playedCheckbox').checked;
            if (isChecked) {
                playedCourses.add(currentCourse.id);
            } else {
                playedCourses.delete(currentCourse.id);
            }
            
            localStorage.setItem('playedCourses', Array.from(playedCourses).join(','));
            
            const marker = markers[currentCourse.id];
            if (marker) {
                marker.setStyle({ fillColor: getColor(currentCourse.id) });
            }
            
            updateStats();
        }

        function openWeb() {
            if (currentCourse) window.open(currentCourse.web, '_blank');
        }

        function updateRating() {
            if (!currentCourse) return;
            
            const ratingValue = parseInt(document.getElementById('ratingSlider').value);
            
            if (ratingValue === 0) {
                delete courseRatings[currentCourse.id];
            } else {
                courseRatings[currentCourse.id] = ratingValue;
            }
            
            localStorage.setItem('courseRatings', JSON.stringify(courseRatings));
            
            // Update display in panel
            if (ratingValue === 0) {
                document.getElementById('ratingValue').textContent = '-';
            } else {
                document.getElementById('ratingValue').textContent = ratingValue + '/10';
            }
            
            // Update marker popup
            const marker = markers[currentCourse.id];
            if (marker) {
                const ratingPercent = ratingValue > 0 ? (ratingValue * 10) + '%' : '';
                const popupText = `<div style="font-size: 12px; color: var(--text-primary);"><strong>${currentCourse.name}</strong><br>${currentCourse.region}<br>${currentCourse.holes} holes${ratingPercent ? '<br>Rating: ' + ratingPercent : ''}</div>`;
                marker.setPopupContent(popupText);
            }
        }

        function filterCourses(e) {
            const searchTerm = e.target.value.toLowerCase();
            golfData.forEach(course => {
                const marker = markers[course.id];
                const matches = course.name.toLowerCase().includes(searchTerm) || 
                               course.location.toLowerCase().includes(searchTerm) ||
                               course.region.toLowerCase().includes(searchTerm);
                marker.setOpacity(searchTerm && !matches ? 0.05 : 0.9);
                if (matches && searchTerm) map.setView([course.lat, course.lng], 12);
            });
        }

        function updateStats() {
            const played = playedCourses.size;
            const unplayed = golfData.length - played;
            const total = golfData.length;
            const playedPercent = total > 0 ? Math.round((played / total) * 100) : 0;
            const unplayedPercent = 100 - playedPercent;
            
            document.getElementById('totalCourses').textContent = total;
            document.getElementById('playedCourses').textContent = played;
            document.getElementById('unplayedCourses').textContent = unplayed;
            document.getElementById('playedPercent').textContent = playedPercent + '%';
            document.getElementById('unplayedPercent').textContent = unplayedPercent + '%';
            document.getElementById('playedPercentage').textContent = playedPercent + '%';
        }

        init();
    </script>
